<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Core 1350 v2</title>
<style>
:root {
  --bg:#0b1020; --panel:#111827; --panel2:#172033; --line:#2b3a55;
  --text:#f8fafc; --muted:#9fb0c8; --accent:#38bdf8; --good:#22c55e;
  --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text)}
.wrap{max-width:1220px;margin:0 auto;padding:20px}
h1{margin:0;font-size:30px}
.subtitle{color:var(--muted);margin:6px 0 18px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:rgba(17,24,39,.95);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 34px rgba(0,0,0,.2)}
.stat .n{font-size:26px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.progress{height:10px;background:#09101f;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
button,select,input{border:1px solid var(--line);background:#0b1220;color:var(--text);padding:10px 12px;border-radius:10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#06283a;font-weight:800}
button.good{background:var(--good);border-color:var(--good);color:#052e16;font-weight:800}
button.warn{background:var(--warn);border-color:var(--warn);color:#422006;font-weight:800}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab.active{background:var(--accent);color:#06283a;font-weight:800}
.study{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.badge{padding:6px 10px;border-radius:999px;background:#082f49;color:#7dd3fc;font-size:12px;margin-bottom:14px}
.en{font-size:38px;font-weight:900;line-height:1.2;margin:8px 0 16px}
.ko{font-size:22px;color:#dbeafe;margin-bottom:12px}
.ex{font-size:16px;color:var(--muted);max-width:820px}
.blur{filter:blur(9px);user-select:none}
.speak-box{margin-top:18px;width:min(760px,100%);display:none}
.speak-box.show{display:block}
.speak-box textarea{width:100%;min-height:90px;border:1px solid var(--line);background:#09101f;color:var(--text);border-radius:12px;padding:12px;font-size:16px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.statusline{font-size:13px;color:var(--muted);margin-top:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{color:#cbd5e1;position:sticky;top:0;background:#111827}
.done{color:var(--good);font-weight:800}
.due{color:var(--warn);font-weight:800}
.controls2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card h3{margin:0 0 8px;font-size:16px}
.note{color:var(--muted);font-size:13px;line-height:1.55}
@media(max-width:820px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .controls2{grid-template-columns:1fr}
 .en{font-size:30px}
 .ko{font-size:19px}
 .wrap{padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Speaking Core 1350 v2</h1>
  <div class="subtitle">Chunk 300 · Phrasal Verb 150 · Core Word 700 · Work English 200</div>

  <div class="grid stats">
    <div class="card stat"><div class="n" id="total">1350</div><div class="l">전체</div></div>
    <div class="card stat"><div class="n" id="learned">0</div><div class="l">학습 완료</div></div>
    <div class="card stat"><div class="n" id="due">0</div><div class="l">오늘 복습</div></div>
    <div class="card stat"><div class="n" id="today">0</div><div class="l">오늘 학습</div></div>
    <div class="card stat"><div class="n" id="pct">0%</div><div class="l">진행률</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="progress"><div id="bar"></div></div>
  </div>

  <div class="controls2" style="margin-top:14px">
    <div class="card mode-card">
      <h3>오늘의 30개</h3>
      <div class="note">복습 예정 항목을 우선 배치하고, 남는 자리는 새 항목으로 채운다.</div>
      <div class="toolbar">
        <button class="primary" id="dailyBtn">오늘 30개 시작</button>
        <button id="dueBtn">복습만</button>
        <button id="newBtn">새 항목만</button>
      </div>
    </div>
    <div class="card mode-card">
      <h3>스피킹 모드</h3>
      <div class="note">한국어 뜻을 보고 영어를 직접 말하거나 입력한 뒤 정답을 확인한다.</div>
      <div class="toolbar">
        <button id="speakingModeBtn">스피킹 모드 ON/OFF</button>
        <button id="randomBtn">랜덤</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <select id="category"></select>
    <input id="search" placeholder="영어/한국어 검색">
    <select id="sort">
      <option value="default">기본 순서</option>
      <option value="due">복습 우선</option>
      <option value="weak">취약도 우선</option>
    </select>
    <button id="resetBtn">학습 기록 초기화</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card study">
    <div class="badge" id="badge"></div>
    <div class="en" id="en"></div>
    <div class="ko" id="ko"></div>
    <div class="ex" id="ex"></div>

    <div class="speak-box" id="speakBox">
      <textarea id="answerInput" placeholder="한국어 뜻을 보고 영어 문장을 직접 입력하거나, 먼저 소리 내서 말한 뒤 입력해봐."></textarea>
      <div class="toolbar" style="justify-content:center">
        <button id="checkAnswerBtn">정답 비교</button>
        <button id="revealBtn">정답 보기</button>
      </div>
      <div class="statusline" id="answerStatus"></div>
    </div>

    <div class="toolbar" style="justify-content:center;margin-top:22px">
      <button id="prevBtn">이전</button>
      <button id="hideBtn">뜻 가리기</button>
      <button id="speakBtn">발음 듣기</button>
      <button class="warn" data-q="1">다시</button>
      <button data-q="2">어려움</button>
      <button data-q="3">보통</button>
      <button class="good" data-q="4">쉬움</button>
      <button class="primary" id="nextBtn">다음</button>
    </div>
    <div class="statusline" id="studyStatus"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <strong>학습 리스트</strong>
      <span class="note">기록은 브라우저 localStorage에 저장돼.</span>
    </div>
    <div style="overflow:auto;max-height:520px;margin-top:10px">
      <table>
        <thead><tr><th>#</th><th>분류</th><th>영어</th><th>뜻</th><th>예문</th><th>상태</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DATA = [{"id": 1, "category": "Conversation Chunk", "english": "I think so.", "korean": "그런 것 같아.", "example": "I think so. That should work.", "rank": 1, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 2, "category": "Conversation Chunk", "english": "I don't think so.", "korean": "아닌 것 같아.", "example": "I don't think so. We need another option.", "rank": 2, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 3, "category": "Conversation Chunk", "english": "I don't know.", "korean": "모르겠어.", "example": "I don't know what happened.", "rank": 3, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 4, "category": "Conversation Chunk", "english": "I have no idea.", "korean": "전혀 모르겠어.", "example": "I have no idea why it failed.", "rank": 4, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 5, "category": "Conversation Chunk", "english": "I know what you mean.", "korean": "무슨 말인지 알아.", "example": "I know what you mean. It can be confusing.", "rank": 5, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 6, "category": "Conversation Chunk", "english": "I see what you mean.", "korean": "무슨 뜻인지 알겠어.", "example": "I see what you mean now.", "rank": 6, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 7, "category": "Conversation Chunk", "english": "What do you mean?", "korean": "무슨 뜻이야?", "example": "What do you mean by that?", "rank": 7, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 8, "category": "Conversation Chunk", "english": "It depends.", "korean": "경우에 따라 달라.", "example": "It depends on the situation.", "rank": 8, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 9, "category": "Conversation Chunk", "english": "That makes sense.", "korean": "말이 되네.", "example": "That makes sense to me.", "rank": 9, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 10, "category": "Conversation Chunk", "english": "Sounds good.", "korean": "좋아.", "example": "Sounds good. Let's do that.", "rank": 10, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 11, "category": "Conversation Chunk", "english": "That's fine.", "korean": "괜찮아.", "example": "That's fine with me.", "rank": 11, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 12, "category": "Conversation Chunk", "english": "Not really.", "korean": "딱히 그렇진 않아.", "example": "Do you like it? Not really.", "rank": 12, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 13, "category": "Conversation Chunk", "english": "I'm not sure.", "korean": "잘 모르겠어.", "example": "I'm not sure if that's correct.", "rank": 13, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 14, "category": "Conversation Chunk", "english": "Let me think.", "korean": "생각 좀 해볼게.", "example": "Let me think about it.", "rank": 14, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 15, "category": "Conversation Chunk", "english": "Give me a second.", "korean": "잠깐만.", "example": "Give me a second. I'm checking.", "rank": 15, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 16, "category": "Conversation Chunk", "english": "Hold on.", "korean": "잠깐만.", "example": "Hold on. I need to check something.", "rank": 16, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 17, "category": "Conversation Chunk", "english": "Wait a minute.", "korean": "잠깐만.", "example": "Wait a minute. Something is wrong.", "rank": 17, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 18, "category": "Conversation Chunk", "english": "By the way,", "korean": "그런데 / 그건 그렇고", "example": "By the way, did you get my message?", "rank": 18, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 19, "category": "Conversation Chunk", "english": "Actually,", "korean": "사실은", "example": "Actually, I changed my mind.", "rank": 19, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 20, "category": "Conversation Chunk", "english": "Basically,", "korean": "기본적으로 / 쉽게 말하면", "example": "Basically, the process is the same.", "rank": 20, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 21, "category": "Conversation Chunk", "english": "I mean,", "korean": "내 말은", "example": "I mean, we can try another way.", "rank": 21, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 22, "category": "Conversation Chunk", "english": "You know,", "korean": "있잖아 / 알다시피", "example": "You know, this happens sometimes.", "rank": 22, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 23, "category": "Conversation Chunk", "english": "For example,", "korean": "예를 들면", "example": "For example, we can start with this case.", "rank": 23, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 24, "category": "Conversation Chunk", "english": "In that case,", "korean": "그렇다면", "example": "In that case, let's do it tomorrow.", "rank": 24, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 25, "category": "Conversation Chunk", "english": "At least", "korean": "적어도", "example": "At least we know the cause now.", "rank": 25, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 26, "category": "Conversation Chunk", "english": "It looks like...", "korean": "~인 것 같아.", "example": "It looks like the server is down.", "rank": 26, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 27, "category": "Conversation Chunk", "english": "It seems like...", "korean": "~인 것 같아.", "example": "It seems like there's a problem.", "rank": 27, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 28, "category": "Conversation Chunk", "english": "I feel like...", "korean": "~하고 싶은 기분이야 / ~인 느낌이야", "example": "I feel like taking a break.", "rank": 28, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 29, "category": "Conversation Chunk", "english": "I'd like to...", "korean": "~하고 싶어.", "example": "I'd like to learn more about it.", "rank": 29, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 30, "category": "Conversation Chunk", "english": "I want to...", "korean": "~하고 싶어.", "example": "I want to try it.", "rank": 30, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 31, "category": "Conversation Chunk", "english": "I need to...", "korean": "~해야 해.", "example": "I need to check the logs.", "rank": 31, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 32, "category": "Conversation Chunk", "english": "I have to...", "korean": "~해야 해.", "example": "I have to leave now.", "rank": 32, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 33, "category": "Conversation Chunk", "english": "I'm going to...", "korean": "~할 거야.", "example": "I'm going to call him later.", "rank": 33, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 34, "category": "Conversation Chunk", "english": "I'm trying to...", "korean": "~하려고 하고 있어.", "example": "I'm trying to understand the issue.", "rank": 34, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 35, "category": "Conversation Chunk", "english": "I'm looking for...", "korean": "~을 찾고 있어.", "example": "I'm looking for a better solution.", "rank": 35, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 36, "category": "Conversation Chunk", "english": "I'm thinking about...", "korean": "~을 생각 중이야.", "example": "I'm thinking about changing jobs.", "rank": 36, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 37, "category": "Conversation Chunk", "english": "Do you want to...?", "korean": "~할래?", "example": "Do you want to grab some coffee?", "rank": 37, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 38, "category": "Conversation Chunk", "english": "Would you like to...?", "korean": "~하시겠어요?", "example": "Would you like to join us?", "rank": 38, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 39, "category": "Conversation Chunk", "english": "Can I...?", "korean": "내가 ~해도 돼?", "example": "Can I ask you something?", "rank": 39, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 40, "category": "Conversation Chunk", "english": "Can you...?", "korean": "~해줄 수 있어?", "example": "Can you check this?", "rank": 40, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 41, "category": "Conversation Chunk", "english": "Could you...?", "korean": "~해주시겠어요?", "example": "Could you send it again?", "rank": 41, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 42, "category": "Conversation Chunk", "english": "How about...?", "korean": "~어때?", "example": "How about tomorrow morning?", "rank": 42, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 43, "category": "Conversation Chunk", "english": "What about...?", "korean": "~은 어때?", "example": "What about this option?", "rank": 43, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 44, "category": "Conversation Chunk", "english": "Why don't we...?", "korean": "우리 ~하는 게 어때?", "example": "Why don't we try again?", "rank": 44, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 45, "category": "Conversation Chunk", "english": "Let me know.", "korean": "알려줘.", "example": "Let me know if anything changes.", "rank": 45, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 46, "category": "Conversation Chunk", "english": "No problem.", "korean": "문제없어.", "example": "No problem. I can do that.", "rank": 46, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 47, "category": "Conversation Chunk", "english": "That's oka ple": "Let's check the change history.", "rank": 198, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 1349, "category": "Work English", "english": "Let's check the commit history.", "korean": "커밋 이력을 확인하자.", "example": "Let's check the commit history.", "rank": 199, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}, {"id": 1350, "category": "Work English", "english": "Who made this change?", "korean": "누가 이 변경했어?", "example": "Who made this change?", "rank": 200, "datasetVersion": "2.0", "sourceType": "curated-speaking-core"}];
const STORE_KEY = "english-speaking-master-1350-v2";
const TODAY_KEY = "english-speaking-master-today-v2";
let state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
let todayState = JSON.parse(localStorage.getItem(TODAY_KEY) || "{}");
let todayStr = new Date().toISOString().slice(0,10);
if(todayState.date !== todayStr) todayState = {date:todayStr, count:0, queue:[]};
let activeCategory = "Conversation Chunk";
let current = 0;
let meaningHidden = false;
let speakingMode = false;
let queueMode = null;
let activeQueue = [];

const $ = id => document.getElementById(id);
const cats = ["All","Conversation Chunk","Phrasal Verb","Core Word","Work English"];

function defaultCard(){ return {reps:0, ease:2.5, interval:0, due:0, lapses:0, last:0}; }
function getCard(id){ return state[id] || defaultCard(); }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); localStorage.setItem(TODAY_KEY, JSON.stringify(todayState)); }
function dayNum(){ return Math.floor(Date.now()/86400000); }

function scoreCard(item){
  const c = getCard(item.id);
  const overdue = c.due ? Math.max(0, dayNum()-c.due) : 0;
  return (c.lapses*5) + overdue + (c.reps===0 ? 1 : 0);
}

function filterData(){
  let arr = DATA.filter(x => activeCategory==="All" || x.category===activeCategory);
  const q = $("search").value.trim().toLowerCase();
  if(q) arr = arr.filter(x => (x.english+" "+x.korean+" "+x.example).toLowerCase().includes(q));
  if(queueMode && activeQueue.length) arr = activeQueue.map(id => DATA[id-1]).filter(Boolean).filter(x => activeCategory==="All" || x.category===activeCategory);
  const sort = $("sort").value;
  if(sort==="due") arr.sort((a,b)=>(getCard(a.id).due||999999)-(getCard(b.id).due||999999));
  if(sort==="weak") arr.sort((a,b)=>scoreCard(b)-scoreCard(a));
  return arr;
}

function renderTabs(){
  $("tabs").innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="tab"+(c===activeCategory?" active":"");
    b.textContent=c;
    b.onclick=()=>{activeCategory=c;current=0;renderAll();};
    $("tabs").appendChild(b);
  });
}

function renderCategorySelect(){
  $("category").innerHTML=cats.map(c=>`<option ${c===activeCategory?"selected":""}>${c}</option>`).join("");
}

function currentItem(){
  const arr = filterData();
  if(!arr.length) return null;
  if(current>=arr.length) current=0;
  if(current<0) current=arr.length-1;
  return arr[current];
}

function renderStudy(){
  const item=currentItem();
  if(!item){
    $("badge").textContent="-"; $("en").textContent="항목 없음"; $("ko").textContent=""; $("ex").textContent="";
    return;
  }
  const c=getCard(item.id);
  $("badge").textContent=item.category+" · #"+item.id;
  if(speakingMode){
    $("en").textContent="영어로 말해봐";
    $("ko").textContent=item.korean;
    $("ex").textContent="예문은 정답 확인 후 보는 걸 권장";
    $("speakBox").classList.add("show");
  } else {
    $("en").textContent=item.english;
    $("ko").textContent=item.korean;
    $("ex").textContent=item.example;
    $("speakBox").classList.remove("show");
  }
  $("ko").classList.toggle("blur", meaningHidden && !speakingMode);
  $("studyStatus").textContent=`반복 ${c.reps}회 · 실패 ${c.lapses}회 · 다음 복습 ${c.due ? new Date(c.due*86400000).toISOString().slice(0,10) : "미설정"}`;
}

function renderStats(){
  const cards = DATA.map(x=>getCard(x.id));
  const learned = cards.filter(c=>c.reps>0).length;
  const due = cards.filter(c=>c.reps>0 && c.due<=dayNum()).length;
  const pct = Math.round(learned/DATA.length*100);
  $("learned").textContent=learned;
  $("due").textContent=due;
  $("today").textContent=todayState.count||0;
  $("pct").textContent=pct+"%";
  $("bar").style.width=pct+"%";
}

function renderTable(){
  const arr=filterData().slice(0,250);
  $("tbody").innerHTML=arr.map((x,i)=>{
    const c=getCard(x.id);
    const status = c.reps===0 ? "-" : (c.due<=dayNum() ? '<span class="due">복습</span>' : '<span class="done">학습</span>');
    return `<tr><td>${x.id}</td><td>${x.category}</td><td><strong>${x.english}</strong></td><td>${x.korean}</td><td>${x.example}</td><td>${status}</td></tr>`;
  }).join("");
}

function renderAll(){ renderTabs(); renderCategorySelect(); renderStudy(); renderStats(); renderTable(); save(); }

function grade(q){
  const item=currentItem(); if(!item) return;
  let c=getCard(item.id);
  const now=dayNum();
  if(q===1){
    c.lapses++; c.reps++; c.interval=1; c.ease=Math.max(1.3,c.ease-0.2); c.due=now+1;
  } else if(q===2){
    c.reps++; c.interval=Math.max(1, Math.round((c.interval||1)*1.4)); c.ease=Math.max(1.3,c.ease-0.05); c.due=now+c.interval;
  } else if(q===3){
    c.reps++; c.interval=c.interval===0?2:Math.max(2,Math.round(c.interval*c.ease)); c.due=now+c.interval;
  } else {
    c.reps++; c.ease=Math.min(3.2,c.ease+0.08); c.interval=c.interval===0?4:Math.max(4,Math.round(c.interval*(c.ease+0.15))); c.due=now+c.interval;
  }
  c.last=now; state[item.id]=c; todayState.count=(todayState.count||0)+1;
  current++; $("answerInput").value=""; $("answerStatus").textContent=""; meaningHidden=false; renderAll();
}

function startDaily(){
  const now=dayNum();
  const due = DATA.filter(x=>{const c=getCard(x.id); return c.reps>0 && c.due<=now;})
                  .sort((a,b)=>(getCard(a.id).due||0)-(getCard(b.id).due||0));
  const fresh = DATA.filter(x=>getCard(x.id).reps===0);
  activeQueue = [...due, ...fresh].slice(0,30).map(x=>x.id);
  todayState.queue=activeQueue; queueMode="daily"; activeCategory="All"; current=0; renderAll();
}
function startDue(){
  const now=dayNum();
  activeQueue = DATA.filter(x=>{const c=getCard(x.id); return c.reps>0 && c.due<=now;}).map(x=>x.id);
  queueMode="due"; activeCategory="All"; current=0; renderAll();
}
function startNew(){
  activeQueue = DATA.filter(x=>getCard(x.id).reps===0).slice(0,30).map(x=>x.id);
  queueMode="new"; activeCategory="All"; current=0; renderAll();
}

$("dailyBtn").onclick=startDaily;
$("dueBtn").onclick=startDue;
$("newBtn").onclick=startNew;
$("randomBtn").onclick=()=>{const arr=filterData(); if(arr.length){current=Math.floor(Math.random()*arr.length);renderAll();}};
$("prevBtn").onclick=()=>{current--;renderAll();};
$("nextBtn").onclick=()=>{current++;renderAll();};
$("hideBtn").onclick=()=>{meaningHidden=!meaningHidden;$("hideBtn").textContent=meaningHidden?"뜻 보기":"뜻 가리기";renderStudy();};
$("speakingModeBtn").onclick=()=>{speakingMode=!speakingMode;$("speakingModeBtn").textContent=speakingMode?"스피킹 모드 ON":"스피킹 모드 OFF";$("answerInput").value="";$("answerStatus").textContent="";renderStudy();};
$("speakBtn").onclick=()=>{const item=currentItem(); if(!item)return; const u=new SpeechSynthesisUtterance(item.english);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u);};
$("revealBtn").onclick=()=>{const item=currentItem(); if(item)$("answerStatus").textContent="정답: "+item.english;};
$("checkAnswerBtn").onclick=()=>{
  const item=currentItem(); if(!item)return;
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,"").replace(/\s+/g," ").trim();
  const a=norm($("answerInput").value), b=norm(item.english);
  if(!a){$("answerStatus").textContent="먼저 영어 문장을 입력해.";return;}
  $("answerStatus").textContent = a===b ? "정확함" : "정답: "+item.english;
};
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>grade(Number(b.dataset.q)));
$("category").onchange=e=>{activeCategory=e.target.value;queueMode=null;activeQueue=[];current=0;renderAll();};
$("search").oninput=()=>{queueMode=null;activeQueue=[];current=0;renderAll();};
$("sort").onchange=()=>{current=0;renderAll();};
$("resetBtn").onclick=()=>{
  if(confirm("모든 학습 기록을 초기화할까?")){state={};todayState={date:todayStr,count:0,queue:[]};queueMode=null;activeQueue=[];renderAll();}
};

renderAll();
</script>
</body>
</html>
