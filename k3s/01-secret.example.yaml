# Copy this file to k3s/secret.yaml, fill in real values, then:
#   kubectl apply -f k3s/secret.yaml
# k3s/secret.yaml is gitignored on purpose -- never commit real secrets.
#
# DATABASE_URL must stay in sync with POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB
# below (Kubernetes Secrets don't support cross-field interpolation like
# docker-compose's ${VAR} substitution did). "postgres" is the in-cluster
# Service name from 02-postgres.yaml, resolvable only inside the
# speaking-core namespace.
apiVersion: v1
kind: Secret
metadata:
  name: speaking-core-secrets
  namespace: speaking-core
type: Opaque
stringData:
  POSTGRES_DB: speaking_core
  POSTGRES_USER: speaking_core
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://speaking_core:CHANGE_ME@postgres:5432/speaking_core?schema=public

  # Google Cloud Console > APIs & Services > Credentials
  GOOGLE_CLIENT_ID: CHANGE_ME.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: CHANGE_ME
  # Must exactly match an "Authorized redirect URI" on the OAuth client.
  GOOGLE_CALLBACK_URL: https://cleanbrain.me/api/auth/google/callback

  # openssl rand -base64 48
  SESSION_SECRET: CHANGE_ME_LONG_RANDOM

  FRONTEND_ORIGIN: https://cleanbrain.me
