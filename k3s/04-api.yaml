apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: speaking-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/cleanbrain-developer/english-core-speaking-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: speaking-core-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: TZ
              value: Asia/Seoul
          # Generous initial delays: the container applies pending Prisma
          # migrations and self-seeds ~1,450 rows before it starts listening
          # (see apps/api/Dockerfile CMD), which takes longer than a typical
          # cold start on first boot against an empty database.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: speaking-core
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
